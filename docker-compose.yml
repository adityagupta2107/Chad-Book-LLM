services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: chadbook-postgres
    environment:
      POSTGRES_DB: chadbook
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - chadbook_pg_data:/var/lib/postgresql/data
     
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chadbook"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  chadbook_pg_data: